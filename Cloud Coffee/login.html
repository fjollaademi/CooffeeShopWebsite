<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="css/style.css">

<style>

.auth-container{
    max-width:500px;
    margin:80px auto;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.auth-container h1{
    text-align:center;
    margin-bottom:30px;
}

.auth-container form{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.auth-container input{
    padding:15px;
}

.auth-container button{
    padding:15px;
    background:#4b2e2e;
    color:white;
    border:none;
    cursor:pointer;
}

</style>

</head>
<body>

<div class="auth-container">

<h1>Login</h1>

<form id="loginForm">

<input
type="email"
placeholder="Email"
required>

<input
type="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

</div>

<script>

document.getElementById("loginForm")
.addEventListener("submit",function(e){

e.preventDefault();

alert("Login Successful!");

window.location.href="index.html";

});

</script>

</body>
</html>
