<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Menu - CloudCafe</title>

<link rel="stylesheet" href="css/style.css">

<style>

.menu-page{
    padding:80px 50px;
}

.menu-page h1{
    text-align:center;
    margin-bottom:40px;
}

.categories{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:40px;
    flex-wrap:wrap;
}

.categories button{
    padding:10px 20px;
    border:none;
    background:#4b2e2e;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

#products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.product{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.product img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.product h3{
    padding:15px;
}

.product p{
    padding:0 15px;
}

.product span{
    display:block;
    padding:15px;
    font-weight:bold;
}

.product button{
    margin:15px;
    padding:10px 20px;
    background:#d4a373;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.back-btn{
    margin-bottom:30px;
    padding:10px 20px;
    border:none;
    background:#4b2e2e;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

</style>

</head>

<body>

<section class="menu-page">

<button
class="back-btn"
onclick="window.location.href='index.html'">
← Home
</button>

<h1>Our Menu</h1>

<div class="categories">

<button onclick="filterProducts('all')">
All
</button>

<button onclick="filterProducts('coffee')">
Coffee
</button>

<button onclick="filterProducts('dessert')">
Desserts
</button>

<button onclick="filterProducts('cold')">
Cold Drinks
</button>

</div>

<div id="products"></div>

</section>

<script src="js/products.js"></script>

</body>
</html>
