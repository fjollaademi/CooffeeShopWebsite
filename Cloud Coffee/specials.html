<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Special Offers</title>

<link rel="stylesheet" href="css/style.css">

<style>

.specials{
padding:80px;
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(300px,1fr));
gap:25px;
}

.offer-card{
background:white;
padding:30px;
border-radius:15px;
text-align:center;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.offer-card h2{
margin-bottom:10px;
}

.discount{
font-size:32px;
font-weight:bold;
color:#4b2e2e;
}

</style>

</head>

<body>

<section class="specials">

<div class="offer-card">

<h2>Monday Coffee Deal</h2>

<p class="discount">20% OFF</p>

<p>All hot coffee drinks.</p>

</div>

<div class="offer-card">

<h2>Dessert Combo</h2>

<p class="discount">Buy 1 Get 1</p>

<p>Selected desserts every Friday.</p>

</div>

<div class="offer-card">

<h2>Weekend Special</h2>

<p class="discount">30% OFF</p>

<p>Large Cappuccino and Latte.</p>

</div>

</section>

</body>
</html>
