<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up</title>

<link rel="stylesheet" href="css/style.css">

<style>

.auth-container{
    max-width:500px;
    margin:80px auto;
    background:white;
    padding:40px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.auth-container form{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.auth-container button{
    padding:15px;
    background:#4b2e2e;
    color:white;
    border:none;
}

</style>

</head>

<body>

<div class="auth-container">

<h1>Create Account</h1>

<form id="signupForm">

<input
type="text"
placeholder="Full Name"
required>

<input
type="email"
placeholder="Email"
required>

<input
type="password"
placeholder="Password"
required>

<button type="submit">
Create Account
</button>

</form>

</div>

<script>

document.getElementById("signupForm")
.addEventListener("submit",function(e){

e.preventDefault();

alert("Account Created!");

window.location.href="login.html";

});

</script>

</body>
</html>
