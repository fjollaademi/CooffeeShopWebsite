<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact</title>

<link rel="stylesheet" href="css/style.css">

<style>

.contact{
max-width:700px;
margin:80px auto;
background:white;
padding:40px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.contact form{
display:flex;
flex-direction:column;
gap:15px;
}

.contact input,
.contact textarea{
padding:15px;
}

.contact textarea{
height:150px;
resize:none;
}

.contact button{
padding:15px;
background:#4b2e2e;
color:white;
border:none;
cursor:pointer;
}

</style>

</head>

<body>

<div class="contact">

<h1>Contact Us</h1>

<br>

<form id="contactForm">

<input
type="text"
placeholder="Full Name"
required>

<input
type="email"
placeholder="Email"
required>

<input
type="text"
placeholder="Subject"
required>

<textarea
placeholder="Your Message"
required>
</textarea>

<button type="submit">

Send Message

</button>

</form>

</div>

<script>

document
.getElementById("contactForm")
.addEventListener("submit",function(e){

e.preventDefault();

alert(
"Your message has been sent!"
);

this.reset();

});

</script>

</body>
</html>
