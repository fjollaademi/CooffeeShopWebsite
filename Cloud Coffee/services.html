<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Services</title>

<link rel="stylesheet" href="css/style.css">

<style>

.services{
padding:80px;
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(300px,1fr));
gap:25px;
}

.service{
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.service h2{
margin-bottom:15px;
}

</style>

</head>

<body>

<section class="services">

<div class="service">
<h2>☕ Coffee Delivery</h2>
<p>Fast coffee delivery to your home or office.</p>
</div>

<div class="service">
<h2>🎉 Event Catering</h2>
<p>Coffee and dessert catering for events.</p>
</div>

<div class="service">
<h2>🏢 Corporate Packages</h2>
<p>Special coffee packages for businesses.</p>
</div>

<div class="service">
<h2>📚 Coffee Workshops</h2>
<p>Learn coffee brewing from professionals.</p>
</div>

</section>

</body>
</html>
