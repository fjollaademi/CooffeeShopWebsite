<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Careers</title>

<link rel="stylesheet" href="css/style.css">

<style>

.jobs{
padding:80px;
}

.job{
background:white;
padding:25px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,.1);
}

.apply-btn{
padding:10px 20px;
background:#4b2e2e;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
margin-top:15px;
}

</style>

</head>

<body>

<div class="jobs">

<h1>Careers At CloudCafe</h1>

<br>

<div class="job">

<h2>Barista</h2>

<p>
Full-time position.
Experience preferred.
</p>

<button
class="apply-btn"
onclick="alert('Application Submitted!')">

Apply

</button>

</div>

<div class="job">

<h2>Cashier</h2>

<p>
Customer service and payments.
</p>

<button
class="apply-btn"
onclick="alert('Application Submitted!')">

Apply

</button>

</div>

<div class="job">

<h2>Pastry Assistant</h2>

<p>
Assist with daily dessert preparation.
</p>

<button
class="apply-btn"
onclick="alert('Application Submitted!')">

Apply

</button>

</div>

</div>

</body>
</html>
