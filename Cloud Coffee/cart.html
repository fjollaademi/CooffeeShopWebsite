<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shopping Cart</title>

<link rel="stylesheet" href="css/style.css">

<style>

.cart-container{
    padding:60px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:white;
    padding:20px;
    margin-bottom:15px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.remove-btn{
    background:red;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.total{
    margin-top:30px;
    font-size:28px;
    font-weight:bold;
}

.checkout-btn{
    margin-top:20px;
    padding:15px 30px;
    background:#4b2e2e;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.empty{
    text-align:center;
    margin-top:50px;
    font-size:24px;
}

</style>

</head>

<body>

<div class="cart-container">

<button
onclick="window.location.href='index.html'"
class="primary-btn">
Home
</button>

<h1>Your Cart</h1>

<div id="cartItems"></div>

<div class="total" id="total"></div>

<button
class="checkout-btn"
onclick="checkout()">
Checkout
</button>

</div>

<script src="js/cart.js"></script>

</body>

</html>
